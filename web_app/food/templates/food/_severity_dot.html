{% load i18n %}{% if day.severity == "none" %}{% translate "No stool / gas values" as dot_label %}{% else %}{% blocktranslate with stool=day.stool|default:"–" gas=day.gas|default:"–" asvar dot_label %}Stool {{ stool }}, gas {{ gas }}{% endblocktranslate %}{% endif %}<span class="cal-dot sev-{{ day.severity }}" data-testid="{{ dot_testid|default:'cal-dot' }}" data-severity="{{ day.severity }}" title="{{ dot_label }}" role="img" aria-label="{{ dot_label }}"></span>
