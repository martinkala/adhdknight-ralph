# console.adhdknight.com — Django web console (Gunicorn on 127.0.0.1:8000)
#
# Pre-certbot template — see the header comment in api.adhdknight.com.conf for
# why this file intentionally does not contain the TLS block certbot adds live.
#
# auth_basic protects the ENTIRE site, evaluated by Nginx before any request
# reaches Django (FR-005, US2 acceptance scenario 1). The credentials file
# (/etc/nginx/.htpasswd_console) is created by deploy/scripts/install.sh's
# setup_basic_auth() step with a placeholder password that MUST be changed
# manually on the server — see server/README.md "Produkčné nasadenie".

server {
    listen 80;
    listen [::]:80;
    server_name console.adhdknight.com;

    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/.htpasswd_console;

    location /static/ {
        alias /opt/adhknight/web_app/staticfiles/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
