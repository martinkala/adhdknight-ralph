# api.adhdknight.com — FastAPI backend (Uvicorn on 127.0.0.1:8095)
#
# This is the PRE-certbot template. `certbot --nginx -d api.adhdknight.com`
# (see deploy/scripts/install.sh) rewrites the live copy on the server in place:
# it adds a `listen 443 ssl;` server block with the issued cert paths and turns
# this port-80 block into a redirect. That mutation happens on the server only —
# this file in the repo intentionally stays the pre-certbot version so re-running
# install.sh / re-deploying this file doesn't clobber the live cert config.
#
# No Basic Auth on this file — the API uses its own JWT auth (016). Do not add
# it here (see FR-005 / SC-004 and deploy/scripts/install.sh's guard check).

server {
    listen 80;
    listen [::]:80;
    server_name api.adhdknight.com;

    location / {
        proxy_pass http://127.0.0.1:8095;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
