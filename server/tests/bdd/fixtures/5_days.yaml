description: "5 days - includes a day with subnode element (C1 algorithm verification)"

entity_config:
  # Root trackable nodes
  overall_feeling:
    weight: 13.0
    impact: 1
    parent: null
    scale: true
  # Group node with children
  lifestyle:
    weight: 20.0
    impact: null
    parent: null
    scale: false
  # Children of lifestyle
  physical_activity:
    weight: 10.0
    impact: 1
    parent: lifestyle
    scale: false
  mindfulness:
    weight: 10.0
    impact: 1
    parent: lifestyle
    scale: false

days:
